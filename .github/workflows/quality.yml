name: Revisión básica

on:
  push:
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar sintaxis JavaScript
        run: node --check app.js
      - name: Verificar archivos principales
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
          test -s docs/MANUAL_USUARIO.md
          test -s docs/EVALUACION_IMPACTO_AMBIENTAL.md
